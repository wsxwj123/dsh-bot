# 网关的自动化测试：Ubuntu、macOS、Windows 三个系统都跑。只用假 Telegram 和假 ACP，不需要任何密钥。
# real-dsh 一项会按仓库 harness/ 的锁文件装上钉死版本的 dsh，再用假模型跑一遍真 dsh 集成测试。
# python 一项跑 Python 周边读账本的测试（chat_history 等，和网关共用一份账本表结构），以及供应商引导的 Python 验收（导入试算、管理台）。
name: gateway

on:
  push:
    paths: ['gateway/**', 'harness/**', 'lab/dsh/lib/**', 'chat_history.py', 'deepseek_client.py', 'memory/**', 'config_loader.py', 'hang_situation.py', 'life-context.py', 'scripts/self_initiate.py', 'jiwen/**', 'tests/unit/test_chat_history*', 'tests/unit/test_m3_life.py', 'gateway_client.py', 'db.py', 'moments/**', 'voicecall/**', 'scripts/recent_moments.py', 'tests/unit/test_m4_dsh.py', 'director.py', 'claude_cli.py', 'tests/unit/test_m5_director.py', 'scripts/import_history.py', 'scripts/run_logged.py', 'tests/unit/test_m6_import.py', 'tests/acceptance/provider_wizard/**', '.github/workflows/gateway.yml']
  pull_request:
    paths: ['gateway/**', 'harness/**', 'lab/dsh/lib/**', 'chat_history.py', 'deepseek_client.py', 'memory/**', 'config_loader.py', 'hang_situation.py', 'life-context.py', 'scripts/self_initiate.py', 'jiwen/**', 'tests/unit/test_chat_history*', 'tests/unit/test_m3_life.py', 'gateway_client.py', 'db.py', 'moments/**', 'voicecall/**', 'scripts/recent_moments.py', 'tests/unit/test_m4_dsh.py', 'director.py', 'claude_cli.py', 'tests/unit/test_m5_director.py', 'scripts/import_history.py', 'scripts/run_logged.py', 'tests/unit/test_m6_import.py', 'tests/acceptance/provider_wizard/**', '.github/workflows/gateway.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: gateway
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test

  real-dsh:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装钉死版本的 dsh
        working-directory: harness
        run: npm ci --no-audit --no-fund
      - working-directory: gateway
        run: bun install --frozen-lockfile
      - name: 真 dsh + 假模型
        working-directory: gateway
        env:
          DSH_BOT_HARNESS: ${{ github.workspace }}/harness
          DSH_TELEMETRY_DISABLED: '1'
        run: bun test --timeout 90000 test/e2e/real-dsh.test.ts

  python:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            tests: unit/test_chat_history_ledger.py unit/test_chat_history_namespace.py unit/test_project_slug.py unit/test_m3_life.py unit/test_m4_dsh.py unit/test_m5_director.py unit/test_m6_import.py acceptance/provider_wizard
          # test_project_slug.py 是旧系统原有的测试，按 Mac/Linux 的路径写的，Windows 上不跑
          - os: windows-latest
            tests: unit/test_chat_history_ledger.py unit/test_chat_history_namespace.py unit/test_m3_life.py unit/test_m4_dsh.py unit/test_m5_director.py unit/test_m6_import.py acceptance/provider_wizard
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install pytest pyyaml flask requests
      - name: 读账本的 Python 测试
        working-directory: tests
        run: python -m pytest -q ${{ matrix.tests }}
